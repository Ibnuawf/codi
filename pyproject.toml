[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codi-analyzer"
description = "Zero-dependency Python code-health analyzer: complexity, churn risk, clone & dead-code detection, import graph, trend tracking, HTML/markdown reports and badges"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdurehman Muhammed", email = "mumabdu@gmail.com" }]
requires-python = ">=3.10"
dynamic = ["version"]
keywords = [
    "static-analysis", "code-quality", "cyclomatic-complexity", "linter",
    "ast", "code-health", "technical-debt", "dead-code", "clone-detection",
    "churn", "maintainability", "radon-alternative",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.scripts]
codi = "codi.cli:main"

[project.urls]
Homepage = "https://github.com/Ibnuawf/codi"
Repository = "https://github.com/Ibnuawf/codi"
Issues = "https://github.com/Ibnuawf/codi/issues"

[tool.setuptools]
packages = ["codi"]

[tool.setuptools.package-data]
codi = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "codi.__version__" }
