[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codi-analyzer"
version = "2.0.0"
description = "Zero-dependency Python code-health analyzer: complexity, hotspots, import graph, HTML reports"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdurehman", email = "mumabdu@gmail.com" }]
requires-python = ">=3.10"
keywords = ["static-analysis", "code-quality", "cyclomatic-complexity", "linter", "ast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
codi = "codi.cli:main"

[project.urls]
Homepage = "https://github.com/Ibnuawf/codi"

[tool.setuptools]
packages = ["codi"]
